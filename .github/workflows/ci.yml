name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-dejavu-core

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest suite
        run: |
          pytest -v

      - name: Run zero-cost Quick Start smoke test
        run: |
          python scripts/make_demo.py --out-dir demo_episode
          python scripts/assemble_storybook.py --episode-dir demo_episode --prefix demo --presets shorts,xiaohongshu,douyin
          python scripts/audit_feed_delivery.py demo_episode/demo_shorts_ready.mp4
          python scripts/flow_route_example.py --episode-dir demo_episode
          python scripts/gen_tts_lines.py --episode-dir demo_episode --dry-run
